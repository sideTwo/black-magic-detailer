<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#090a09">
  <title>Leder · Aktuelle Vorschau · Black Magic Detailer</title>
  <link rel="icon" href="assets/brand-icon-v2.svg" type="image/svg+xml">
  <style>
    @font-face{font-family:Manrope;src:url('assets/fonts/manrope-regular.woff2') format('woff2');font-display:swap}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#090a09;color:#eeeae2;font:14px/1.6 Manrope,Arial,sans-serif}
    main{position:relative;height:100svh;min-height:420px;isolation:isolate;overflow:hidden}
    video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;z-index:-1}
    video::-webkit-media-controls{display:none!important}
    #arrival{z-index:0}#arrival[hidden]{display:none}
    header{position:absolute;inset:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:24px 3%;background:linear-gradient(#090a09d9,transparent)}
    header img{display:block;width:170px;height:auto}a{color:#d6ba84;text-underline-offset:5px}
    nav{display:flex;gap:8px}nav button{padding:10px 16px}nav button[aria-pressed=true]{border-color:#d6ba84;background:#30291dcc;color:#f1dfbb}
    .caption{position:absolute;bottom:0;left:0;right:0;padding:100px 3% 28px;background:linear-gradient(transparent,#090a09e8);pointer-events:none;display:flex;justify-content:space-between;align-items:flex-end;gap:24px}
    .caption p{margin:6px 0 0;max-width:65ch;color:#cec9c0}.caption .meta{color:#d6ba84;font-size:11px;letter-spacing:.11em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(23px,3vw,42px);font-weight:500;letter-spacing:-.04em}
    button{pointer-events:auto;min-height:46px;padding:12px 20px;border:1px solid #b5996599;background:#090a09a6;color:#d6ba84;font:inherit;cursor:pointer;flex-shrink:0}
    button:hover{background:#30291d}button:focus-visible,a:focus-visible{outline:2px solid #d6ba84;outline-offset:5px}
    @media(max-width:600px){header{padding:16px 5%;display:grid;grid-template-columns:1fr auto;gap:12px}header img{width:135px}header>a{grid-column:2;grid-row:1}nav{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}nav button{padding:8px;font-size:12px}.caption{padding:80px 5% 22px;display:block}.caption p{font-size:12px}.caption button{margin-top:16px}}
  </style>
</head>
<body>
  <main aria-label="Aktuelle Vorschau der Lederanimation">
    <video id="film" loop muted playsinline preload="auto" disablepictureinpicture disableremoteplayback poster="assets/garage/leder-kreise-v4.webp" src="assets/garage/leder-kreise-v4-1080p.mp4" aria-label="Stumme Lederreinigung mit Bürste und mittlerer Schaummenge."></video>
    <video id="arrival" autoplay muted playsinline preload="auto" disablepictureinpicture disableremoteplayback poster="assets/garage/tim-garage-vector-v15-4k.webp" src="assets/garage/leder-kamerafahrt-v5-1080p.mp4" aria-label="Kamerabogen zur Fahrertür, Türöffnung, Nahzoom und Bürstenkontakt."></video>
    <header><img src="assets/brand-logo-v2.svg" alt="Black Magic Detailer"><nav aria-label="Leder-Vorschau wählen"><button type="button" data-view="camera" aria-pressed="true">01 Gesamte Fahrt</button><button type="button" data-view="brush" aria-pressed="false">02 Reinigung</button></nav><a href="./">Zur Garage</a></header>
    <div class="caption">
      <div><p class="meta">Bewegungsvorschau V5 · 1080p · 24 FPS · ohne Ton</p><h1 id="view-title">Von der Garage bis ins Leder.</h1><p id="status" aria-live="polite">Die Kamera fährt zur Fahrertür und während des Öffnens hinein. Der Nahzoom nutzt ein festes Sitzbild; danach beginnt die Reinigung. Bitte den vollständigen Anschluss prüfen.</p></div>
      <button id="replay" type="button">Erneut ansehen</button>
    </div>
  </main>
  <script>
    const film=document.querySelector('#film');
    const replay=document.querySelector('#replay');
    const status=document.querySelector('#status');
    const arrival=document.querySelector('#arrival');
    const views={camera:{title:'Von der Garage bis ins Leder.',caption:status.textContent},brush:{title:'Lederreinigung im Detail.',caption:'Die Nahaufnahme läuft ohne Ton in einer Schleife. Die Kamerafahrt und die Türöffnung werden nicht wiederholt.'}};
    let selected='camera',revision=0;
    function activeFilm(){return !arrival.hidden&&!arrival.ended?arrival:film;}
    async function play(target=activeFilm()){const current=revision;target.muted=true;try{await target.play();if(current!==revision)return;status.textContent=views[selected].caption;replay.textContent='Erneut ansehen';}catch(reason){if(current!==revision||reason.name==='AbortError')return;status.textContent='Zum Abspielen bitte auf „Video starten“ tippen.';replay.textContent='Video starten';}}
    function selectView(key){if(!views[key])return;revision++;arrival.pause();film.pause();selected=key;film.currentTime=0;arrival.hidden=key!=='camera';if(key==='camera')arrival.currentTime=0;document.querySelector('#view-title').textContent=views[key].title;status.textContent=views[key].caption;document.querySelectorAll('[data-view]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.view===key)));history.replaceState(null,'',key==='camera'?'#anfahrt':'#reinigung');play();}
    arrival.addEventListener('ended',()=>{if(selected!=='camera')return;const current=revision;film.currentTime=0;film.addEventListener('playing',()=>{if(current===revision)arrival.hidden=true;},{once:true});play(film);});
    document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>selectView(button.dataset.view)));
    replay.addEventListener('click',()=>selectView(selected));
    [film,arrival].forEach(clip=>clip.addEventListener('error',()=>{status.textContent='Der Clip konnte nicht geladen werden. Bitte erneut versuchen.';}));
    document.addEventListener('visibilitychange',()=>{if(document.hidden){film.pause();arrival.pause();}else play();});
    if(location.hash==='#reinigung')selectView('brush');else play();
  </script>
</body>
</html>
